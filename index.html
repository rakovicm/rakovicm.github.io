<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal GitHub Pages site of Mirko Raković, full professor of robotics at the University of Novi Sad. Humanoid locomotion, HRI, and robotic fabrication."
    />
    <meta property="og:title" content="Mirko Raković · Robotics" />
    <meta
      property="og:description"
      content="Humanoid locomotion, human–robot cooperation, and robotic fabrication."
    />
    <meta property="og:type" content="website" />
    <title>Mirko Raković · Robotics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
